 p{margin:4px 0}.badge{display:inline-block;border-radius:20px;background:#e7f1ff;color:#1161ab;padding:3px 8px;font-size:10px;white-space:nowrap}.badge.stop{background:#fff0d8;color:#956000}.badge.done{background:#e5f6ed;color:#18744f}.badge.hold{background:#ffe8e8;color:#a53035}.bar{height:6px;background:#e7edf4;border-radius:10px;margin-top:4px;min-width:70px}.bar span{display:block;height:100%;background:#2581cc;border-radius:10px}table{border-collapse:collapse;width:100%;min-width:730px}th{background:#f3f6f9;color:#65758a;text-align:left;font-size:10px;padding:9px;white-space:nowrap}td{padding:9px;border-bottom:1px solid #eaf0f5;font-size:12px;vertical-align:middle}tr:last-child td{border-bottom:0}.scroll{overflow:auto}.search{border:1px solid var(--line);padding:8px;border-radius:7px;min-width:200px}.hidden{display:none!important}.docrow,.report{border-bottom:1px solid #edf0f4;padding:11px 4px}.docrow:last-child,.report:last-child{border:0}.link{color:#1269ad;text-decoration:none}.actions button{color:#1269ad;background:none;border:0;padding:3px}.modalbg{position:fixed;inset:0;background:#10233b80;display:grid;place-items:center;padding:16px;z-index:4}.modal{width:min(720px,100%);max-height:92vh;overflow:auto;background:white;border-radius:12px;padding:20px}.modal h2{margin:0 0 14px;font-size:18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:4px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted);font-weight:600}.field input,.field select,.field textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px}.field textarea{min-height:70px}.footbuttons{display:flex;justify-content:space-between;margin-top:15px}.toast{position:fixed;bottom:20px;right:20px;background:#183451;color:white;padding:11px 15px;border-radius:8px;z-index:8}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.summary .card{padding:12px}@media(max-width:900px){.sidebar{width:62px;padding:14px 6px}.brand{font-size:0;padding:0 8px 16px}.brand:before{content:'EPC';font-size:12px}.brand small,.nav button .txt,.sidefoot{display:none}.nav button{font-size:0;text-align:center}.nav button .ico{font-size:17px}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.main{padding:15px 10px}.top{align-items:flex-start;flex-direction:column}.dashgrid{grid-template-columns:1fr}.cards{gap:7px}.card{padding:10px}.value{font-size:19px}.form{grid-template-columns:1fr}.field.full{grid-column:auto}}

<script src="https://www.gstatic.com/firebasejs/13.1.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/13.1.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore-compat.js"></script><script src="./config.js"></script><script>
const KEY='epc-project-manager-v2';
const sample={projects:[
{id:'DBI0002',code:'DBI0002',name:'Petrolimex số 1 Tuần Giáo',owner:'Hoàng',progress:30,status:'Tạm dừng',contract:180000000,advance:50000000,paid:40000000,blocker:'Mới nhận trụ sạc, chưa được cấp vật tư TBA từ CĐT.',docs:'',updated:'2026-10-27'},
{id:'HN02459',code:'HN02459',name:'HN02459',owner:'Lương Văn Anh',progress:75,status:'Nghiệm thu',contract:220000000,advance:60000000,paid:120000000,blocker:'Bổ sung biên bản nghiệm thu và bàn giao mặt bằng.',docs:'',updated:'2026-10-28'},
{id:'TNG10596',code:'TNG10596',name:'Tuấn Hằng – BĐX Tích Lương',owner:'Lê Đình Thái',progress:60,status:'Đang thi công',contract:240000000,advance:70000000,paid:100000000,blocker:'Theo dõi ký PL HĐ và tiến độ cấp vật tư.',docs:'',updated:'2026-10-28'},
{id:'VETH00109',code:'V.E.THO0109',name:'CHXD PVO TH Số 03',owner:'Lương Văn Anh',progress:20,status:'Chuẩn bị',contract:140000000,advance:30000000,paid:20000000,blocker:'Chờ duyệt BOQ, xác nhận bàn giao mặt bằng.',docs:'',updated:'2026-10-26'},

{id:'SLA0009',code:'SLA0009',name:'Điều chỉnh công suất trạm SLA0009',owner:'Lương Văn Anh',progress:85,status:'Nghiệm thu',contract:170000000,advance:40000000,paid:71500000,blocker:'',docs:'',updated:'2026-10-29'}],reports:[
{id:'r1',projectId:'DBI0002',date:'2026-10-27',author:'Hoàng',content:'Mới nhận trụ sạc, đang chờ chủ đầu tư cấp vật tư TBA.'},
{id:'r2',projectId:'TNG10596',date:'2026-10-28',author:'Lê Đình Thái',content:'Theo dõi ký phụ lục hợp đồng và tiến độ cấp vật tư.'},
{id:'r3',projectId:'HN02459',date:'2026-10-28',author:'Lương Văn Anh',content:'Bổ sung biên bản nghiệm thu và hoàn tất bàn giao mặt bằng.'}]};
let db=loadData(),current='home';db.settings??={investors:['Wincomer','V-Green'],projectTypes:['Trạm sạc','Tủ đổi pin','Khác']};db.settings.investors=[...new Set([...(db.settings.investors||[]),...db.projects.map(p=>p.investor).filter(Boolean)])];db.settings.projectTypes=[...new Set([...(db.settings.projectTypes||[]),...db.projects.map(p=>p.projectType).filter(Boolean)])];db.projects.forEach(p=>{p.subcontractor??='';p.subAdvance??=0;p.subPaid??=0;p.investor??='';p.projectType??='Trạm sạc';p.contractProgress??='';p.stationCode??='';p.handoverDate??='';p.commissioningDate??='';p.advanceDate??='';p.subAdvanceDate??='';p.subPaidDate??='';p.drawingUrl??='';p.contractUrl??='';p.dossierLinks??=p.docs||''});function loadData(){try{let v=localStorage.getItem(KEY);if(v){let d=JSON.parse(v);d.projects.forEach(p=>{p.subcontractor??='';p.subAdvance??=0;p.subPaid??=0;p.investor??='';p.projectType??='Trạm sạc';p.contractProgress??='';p.stationCode??='';p.handoverDate??='';p.commissioningDate??='';p.advanceDate??='';p.subAdvanceDate??='';p.subPaidDate??='';p.drawingUrl??='';p.contractUrl??='';p.dossierLinks??=p.docs||''});return d}let old=localStorage.getItem('epc-project-manager-v1');if(old){let migrated=JSON.parse(old);if(migrated.projects?.some(p=>p.name?.includes('Depot Long Biên')))return structuredClone(sample);migrated.projects.forEach(p=>{p.subcontractor='';p.subAdvance=0;p.subPaid=0;p.investor='';p.projectType='Trạm sạc';p.contractProgress='';p.stationCode='';p.handoverDate='';p.commissioningDate='';p.advanceDate='';p.subAdvanceDate='';p.subPaidDate='';p.drawingUrl='';p.contractUrl='';p.dossierLinks=p.docs||''});return migrated}}catch{}return structuredClone(sample)}let firebaseAuth=null,firebaseDb=null,stateRef=null,cloudRevision=0,cloudReady=false,syncPaused=false,pendingCloudWrites=0,saveQueue=Promise.resolve(),unsubscribeState=null;
function normalizeCloudData(value){value=value&&typeof value==='object'?value:{};value.projects??=[];value.reports??=[];value.settings??={investors:['Wincomer','V-Green'],projectTypes:['Trạm sạc','Tủ đổi pin','Khác']};value.settings.investors??=['Wincomer','V-Green'];value.settings.projectTypes??=['Trạm sạc','Tủ đổi pin','Khác'];value.settings.investors=[...new Set([...value.settings.investors,...value.projects.map(p=>p.investor).filter(Boolean)])];value.settings.projectTypes=[...new Set([...value.settings.projectTypes,...value.projects.map(p=>p.projectType).filter(Boolean)])];value.projects.forEach(p=>{p.subcontractor??='';p.subAdvance??=0;p.subPaid??=0;p.investor??='';p.projectType??='Trạm sạc';p.contractProgress??='';p.stationCode??='';p.handoverDate??='';p.commissioningDate??='';p.advanceDate??='';p.subAdvanceDate??='';p.subPaidDate??='';p.drawingUrl??='';p.contractUrl??='';p.dossierLinks??=p.docs||''});return value}
function save(){localStorage.setItem(KEY,JSON.stringify(db));render();if(!cloudReady||syncPaused||!stateRef)return;pendingCloudWrites++;saveQueue=saveQueue.then(async()=>{let payload=JSON.parse(JSON.stringify(db)),expectedRevision=cloudRevision;await firebaseDb.runTransaction(async tx=>{let snap=await tx.get(stateRef),actual=snap.exists?Number(snap.data().revision||0):0;if(actual!==expectedRevision)throw new Error('EPC_REVISION_CONFLICT');tx.set(stateRef,{revision:expectedRevision+1,payload,updatedAt:firebase.firestore.FieldValue.serverTimestamp()})});cloudRevision=expectedRevision+1;pendingCloudWrites=Math.max(0,pendingCloudWrites-1)}).catch(error=>{pendingCloudWrites=0;syncPaused=true;notice(error?.message==='EPC_REVISION_CONFLICT'?'Có người vừa cập nhật dữ liệu. Hãy tải lại trang rồi nhập lại phần vừa sửa.':'Chưa đồng bộ được dữ liệu. Kiểm tra mạng rồi tải lại trang.')})}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND',maximumFractionDigits:0}).format(+n||0)}function remain(p){return Math.max(0,(+p.contract||0)-(+p.paid||0))}function badge(s){let c=s==='Tạm dừng'?'hold':s==='Nghiệm thu'?'stop':s==='Hoàn thành'?'done':'';return `<span class="badge ${c}">${esc(s)}</span>`}function name(id){return db.projects.find(p=>p.id===id)?.name||'Dự án đã xóa'}
const viewTitle={home:'Tổng quan dự án',projects:'Quản lý dự án','progress':'Tiến độ & vướng mắc',finance:'Thanh toán & tạm ứng',documents:'Hồ sơ dự án',reports:'Báo cáo hiện trường',customize:'Tùy biến danh mục dự án'};
function render(){document.querySelector('#title').textContent=viewTitle[current];let root=document.querySelector('#page');if(current==='home')root.innerHTML=home();else if(current==='projects')root.innerHTML=projectPage();else if(current==='progress')root.innerHTML=progressPage();else if(current==='finance')root.innerHTML=financePage();else if(current==='documents')root.innerHTML=documentsPage();else if(current==='customize')root.innerHTML=customizePage();else root.innerHTML=reportsPage();bind()}
function investorOverview(){let groups=[...new Set(db.projects.map(p=>p.investor||'Chưa phân loại'))].sort((a,b)=>a.localeCompare(b,'vi'));return `<section class="panel"><div class="panelhead"><h2>Tổng quan theo chủ đầu tư</h2><span class="small">Số dự án · tiến độ thực tế · giá trị hợp đồng</span></div><div class="cards">${groups.map(g=>{let ps=db.projects.filter(p=>(p.investor||'Chưa phân loại')===g),total=ps.reduce((a,p)=>a+(+p.contract||0),0),avg=ps.length?Math.round(ps.reduce((a,p)=>a+(+p.progress||0),0)/ps.length):0,types=[...new Set(ps.map(p=>p.projectType||'Trạm sạc'))].join(', ');return `<button class="card" data-select-investor="${esc(g)}" style="text-align:left"><label>${esc(g)}</label><div class="value">${ps.length} dự án</div><div class="small">${types} · Tiến độ TB ${avg}%</div><div class="small">Hợp đồng ${shortMoney(total)}</div></button>`}).join('')}</div></section>`}
function home(){let n=db.projects.length,avg=n?Math.round(db.projects.reduce((a,p)=>a+(+p.progress||0),0)/n):0,contracts=db.projects.reduce((a,p)=>a+(+p.contract||0),0),rec=db.projects.reduce((a,p)=>a+remain(p),0),pct=contracts?Math.round(db.projects.reduce((a,p)=>a+(+p.paid||0),0)/contracts*100):0;let watch=db.projects.filter(p=>p.blocker||p.status==='Tạm dừng').slice(0,6);let recent=[...db.projects].sort((a,b)=>b.updated.localeCompare(a.updated));return `<div class="cards"><div class="card"><label>Tổng số dự án</label><div class="value">${n}</div><div class="small">${db.projects.filter(p=>p.status==='Đang thi công').length} dự án đang theo dõi</div></div><div class="card"><label>Tiến độ bình quân</label><div class="value">${avg}%</div><div class="bar"><span style="width:${avg}%"></span></div></div><div class="card"><label>Giá trị hợp đồng</label><div class="value">${shortMoney(contracts)}</div><div class="small">VND · Dữ liệu mẫu</div></div><div class="card"><label>Còn phải thu</label><div class="value">${shortMoney(rec)}</div><div class="small">Hợp đồng trừ đã thanh toán (${pct}% đã thu)</div></div></div>${investorOverview()}<div class="dashgrid"><section class="panel"><div class="panelhead"><h2>Dự án cần chú ý</h2></div>${watch.map(p=>`<div class="alert"><b>${esc(p.code||p.id)}</b><span style="float:right">${badge(p.status)}</span><p>${esc(p.blocker||'Cần theo dõi tiến độ nghiệm thu.')}</p><div class="small">Phụ trách: ${esc(p.owner)}</div><button class="btn" data-edit="${esc(p.id)}">Xem dự án</button></div>`).join('')||'<div class="small">Không có vướng mắc cần chú ý.</div>'}</section><section class="panel"><div class="panelhead"><h2>Tiến độ theo dự án</h2></div>${[...db.projects].sort((a,b)=>b.progress-a.progress).map(p=>`<div class="alert"><span>${esc(p.code||p.id)}</span><b style="float:right">${p.progress}%</b><div class="bar"><span style="width:${p.progress}%"></span></div></div>`).join('')}</section></div><section class="panel"><div class="panelhead"><h2>Dự án cập nhật gần đây</h2><button class="btn" data-nav="projects">Danh sách dự án</button></div><div class="scroll"><table><thead><tr><th>Mã dự án</th><th>Tên dự án</th><th>Phụ trách</th><th>Tiến độ</th><th>Tình trạng</th><th>Còn phải thu</th></tr></thead><tbody>${recent.map(p=>`<tr><td>${esc(p.code||p.id)}</td><td>${esc(p.name)}</td><td>${esc(p.owner)}</td><td>${p.progress}%</td><td>${badge(p.status)}</td><td>${money(remain(p))}</td></tr>`).join('')}</tbody></table></div></section>`}
function shortMoney(n){if(n>=1e9)return (n/1e9).toLocaleString('vi-VN',{maximumFractionDigits:2})+' tỷ';if(n>=1e6)return (n/1e6).toLocaleString('vi-VN',{maximumFractionDigits:1})+' tr';return money(n)}
function projectPage(){let investors=[...new Set([...db.settings.investors,...(db.projects.some(p=>!p.investor)?['Chưa phân loại']:[])])].sort((a,b)=>a.localeCompare(b,'vi'));return `<section class="panel"><div class="panelhead"><h2>Danh sách dự án</h2><div class="btnrow"><input id="search" class="search" placeholder="Tìm tên, mã, phụ trách"><select id="investorFilter" class="search"><option value="">Tất cả chủ đầu tư</option>${investors.map(x=>`<option>${esc(x)}</option>`)}</select><select id="typeFilter" class="search"><option value="">Tất cả loại dự án</option>${db.settings.projectTypes.map(x=>`<option>${x}</option>`)}</select><select id="status" class="search"><option value="">Tất cả tình trạng</option>${['Chuẩn bị','Đang thi công','Nghiệm thu','Tạm dừng','Hoàn thành'].map(x=>`<option>${x}</option>`)}</select></div></div><div class="scroll"><table><thead><tr><th>Chủ đầu tư</th><th>Loại dự án</th><th>Tên dự án</th><th>Mã dự án</th><th>Tiến độ hợp đồng</th><th>Tiến độ thực tế</th><th>Vướng mắc</th><th>Thầu phụ</th></tr></thead><tbody id="projectsRows">${projectRows(db.projects)}</tbody></table></div><div class="small" style="margin-top:8px">Chọn một dòng để xem đầy đủ thông tin dự án.</div></section>`}function projectRows(list){return list.map(p=>`<tr class="clickrow" data-view="${esc(p.id)}"><td>${esc(p.investor||'Chưa phân loại')}</td><td>${esc(p.projectType||'Trạm sạc')}</td><td><b>${esc(p.name)}</b></td><td>${esc(p.code||p.id)}</td><td>${p.contractProgress===''?'—':esc(p.contractProgress)+'%'}</td><td>${p.progress}%<div class="bar"><span style="width:${p.progress}%"></span></div></td><td>${esc(p.blocker||'—')}</td><td>${esc(p.subcontractor||'—')}</td></tr>`).join('')||'<tr><td colspan="8">Chưa có dự án</td></tr>'}
function progressPage(){return `<section class="panel"><div class="panelhead"><h2>Cập nhật tiến độ và xử lý vướng mắc</h2><button class="btn primary" id="progressAdd">Cập nhật dự án</button></div><div class="scroll"><table><thead><tr><th>Mã / Dự án</th><th>Tiến độ</th><th>Tình trạng</th><th>Vướng mắc / phát sinh</th><th>Phụ trách</th><th>Cập nhật</th></tr></thead><tbody>${db.projects.map(p=>`<tr><td><b>${esc(p.code||p.id)}</b><br>${esc(p.name)}</td><td>${p.progress}%<div class="bar"><span style="width:${p.progress}%"></span></div></td><td>${badge(p.status)}</td><td>${esc(p.blocker||'—')}</td><td>${esc(p.owner)}</td><td><button class="btn" data-edit="${esc(p.id)}">Cập nhật</button></td></tr>`).join('')}</tbody></table></div></section>`}
function financePage(){let sum=k=>db.projects.reduce((a,p)=>a+(+p[k]||0),0);return `<div class="summary"><div class="card"><label>Tổng hợp đồng</label><div class="value">${shortMoney(sum('contract'))}</div></div><div class="card"><label>Đã thu từ chủ đầu tư</label><div class="value">${shortMoney(sum('paid'))}</div></div><div class="card"><label>Đã thanh toán cho thầu phụ</label><div class="value">${shortMoney(sum('subPaid'))}</div></div></div><section class="panel"><div class="panelhead"><h2>Theo dõi tài chính chủ đầu tư và thầu phụ</h2></div><div class="scroll"><table><thead><tr><th>Chủ đầu tư</th><th>Loại</th><th>Mã dự án</th><th>Tên dự án</th><th>Hợp đồng CĐT</th><th>Tạm ứng CĐT</th><th>Đã thu CĐT</th><th>Còn phải thu CĐT</th><th>Nhà thầu phụ</th><th>Tạm ứng thầu phụ</th><th>Đã trả thầu phụ</th><th></th></tr></thead><tbody>${db.projects.map(p=>`<tr><td>${esc(p.investor||'Chưa phân loại')}</td><td>${esc(p.projectType||'Trạm sạc')}</td><td>${esc(p.code||p.id)}</td><td>${esc(p.name)}</td><td>${money(p.contract)}</td><td>${money(p.advance)}</td><td>${money(p.paid)}</td><td><b>${money(remain(p))}</b></td><td>${esc(p.subcontractor||'—')}</td><td>${money(p.subAdvance)}</td><td>${money(p.subPaid)}</td><td><button class="btn" data-edit="${esc(p.id)}">Cập nhật</button></td></tr>`).join('')}</tbody></table></div></section>`}
function documentsPage(){return `<section class="panel"><div class="panelhead"><h2>Hồ sơ dự án</h2><span class="small">Liên kết được cập nhật trong hồ sơ chi tiết của từng dự án</span></div><div class="scroll"><table><thead><tr><th>Chủ đầu tư</th><th>Loại</th><th>Dự án / mã</th><th>Bản vẽ thiết kế</th><th>Hợp đồng</th><th>Hồ sơ khác</th><th></th></tr></thead><tbody>${db.projects.map(p=>`<tr><td>${esc(p.investor||'Chưa phân loại')}</td><td>${esc(p.projectType||'Trạm sạc')}</td><td><b>${esc(p.name)}</b><br><span class="small">${esc(p.code||p.id)} · Mã trạm ${esc(p.stationCode||'—')}</span></td><td>${p.drawingUrl?`<a class="link" href="${esc(p.drawingUrl)}" target="_blank" rel="noopener">Mở bản vẽ ↗</a>`:'—'}</td><td>${p.contractUrl?`<a class="link" href="${esc(p.contractUrl)}" target="_blank" rel="noopener">Mở hợp đồng ↗</a>`:'—'}</td><td>${(p.dossierLinks||p.docs||'').split(/\r?\n/).filter(Boolean).map((u,i)=>`<a class="link" href="${esc(u)}" target="_blank" rel="noopener">Hồ sơ ${i+1} ↗</a>`).join('<br>')||'—'}</td><td><button class="btn" data-edit="${esc(p.id)}">Cập nhật</button></td></tr>`).join('')||'<tr><td colspan="7">Chưa có dự án.</td></tr>'}</tbody></table></div><p class="small">Ứng dụng lưu liên kết đến tài liệu; tệp không được tải lên máy chủ. Với hồ sơ khác, nhập một liên kết trên mỗi dòng.</p></section>`}
function customizePage(){let investorRows=db.settings.investors.map(x=>`<div class="docrow"><span>${esc(x)}</span>${db.projects.some(p=>p.investor===x)?'<span class="small">Đang dùng</span>':`<button class="btn" data-remove-category="investors" data-value="${esc(x)}">Xóa</button>`}</div>`).join('');let typeRows=db.settings.projectTypes.map(x=>`<div class="docrow"><span>${esc(x)}</span>${db.projects.some(p=>p.projectType===x)?'<span class="small">Đang dùng</span>':`<button class="btn" data-remove-category="projectTypes" data-value="${esc(x)}">Xóa</button>`}</div>`).join('');return `<div class="dashgrid"><section class="panel"><div class="panelhead"><h2>Chủ đầu tư</h2></div><p class="small">Tạo danh mục để chọn nhanh trong hồ sơ dự án và lọc danh sách.</p><div class="btnrow"><input id="newInvestor" class="search" placeholder="Tên chủ đầu tư"><button id="addInvestor" class="btn primary">Thêm</button></div>${investorRows}</section><section class="panel"><div class="panelhead"><h2>Loại dự án</h2></div><p class="small">Ví dụ: Trạm sạc, Tủ đổi pin. Có thể thêm loại riêng.</p><div class="btnrow"><input id="newProjectType" class="search" placeholder="Tên loại dự án"><button id="addProjectType" class="btn primary">Thêm</button></div>${typeRows}</section></div>`}
function addCategory(kind,inputId){let input=document.getElementById(inputId),value=input?.value.trim();if(!value)return notice('Nhập tên danh mục trước');if(db.settings[kind].some(x=>x.toLocaleLowerCase('vi')===value.toLocaleLowerCase('vi')))return notice('Danh mục này đã có');db.settings[kind].push(value);save();notice('Đã thêm danh mục')}
function removeCategory(kind,value){if(db.projects.some(p=>kind==='investors'?p.investor===value:p.projectType===value))return notice('Danh mục đang được dự án sử dụng');db.settings[kind]=db.settings[kind].filter(x=>x!==value);save();notice('Đã xóa danh mục')}function reportsPage(){return `<section class="panel"><div class="panelhead"><h2>Nhật ký hiện trường theo dự án</h2><button id="newReport" class="btn primary">＋ Ghi báo cáo</button></div>${[...db.reports].sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<div class="report"><b>${esc(name(r.projectId))}</b><div class="small">${esc(r.date)} · ${esc(r.author)}</div><p>${esc(r.content)}</p>${r.docs?`<a class="link" href="${esc(r.docs)}" target="_blank">Mở hồ sơ ↗</a>`:''} <button class="actions" data-rdelete="${esc(r.id)}">Xóa</button></div>`).join('')||'<p>Chưa có báo cáo hiện trường.</p>'}</section>`}
function go(p){current=p;document.querySelectorAll('.nav [data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.querySelector('#add').classList.toggle('hidden',p==='reports');render()}document.querySelector('#nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page);if(e.target.closest('#navAdd'))editProject()};document.querySelector('#add').onclick=()=>editProject();
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editProject(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteProject(b.dataset.delete));document.querySelectorAll('[data-rdelete]').forEach(b=>b.onclick=()=>deleteReport(b.dataset.rdelete));document.querySelectorAll('[data-view]').forEach(row=>row.onclick=e=>{if(!e.target.closest('button,a'))viewProject(row.dataset.view)});document.querySelectorAll('[data-select-investor]').forEach(b=>b.onclick=()=>{go('projects');let f=document.querySelector('#investorFilter');if(f){f.value=b.dataset.selectInvestor;f.dispatchEvent(new Event('change'))}});document.querySelector('#progressAdd')?.addEventListener('click',()=>editProject());document.querySelector('#newReport')?.addEventListener('click',editReport);document.querySelector('#addInvestor')?.addEventListener('click',()=>addCategory('investors','newInvestor'));document.querySelector('#addProjectType')?.addEventListener('click',()=>addCategory('projectTypes','newProjectType'));document.querySelectorAll('[data-remove-category]').forEach(b=>b.onclick=()=>removeCategory(b.dataset.removeCategory,b.dataset.value));let s=document.querySelector('#search'),f=document.querySelector('#status'),i=document.querySelector('#investorFilter'),t=document.querySelector('#typeFilter');function filter(){let q=s.value.toLowerCase(),st=f.value,inv=i?.value||'',typ=t?.value||'';document.querySelector('#projectsRows').innerHTML=projectRows(db.projects.filter(p=>(!q||`${p.code} ${p.name} ${p.owner} ${p.investor}`.toLowerCase().includes(q))&&(!st||p.status===st)&&(!inv||(p.investor||'Chưa phân loại')===inv)&&(!typ||p.projectType===typ)));bind()}if(s){s.oninput=filter;f.onchange=filter;i.onchange=filter;t.onchange=filter}}
function field(label,key,val='',type='text',full=false,required=''){return `<div class="field ${full?'full':''}"><label>${label}</label>${type==='textarea'?`<textarea name="${key}">${esc(val)}</textarea>`:`<input name="${key}" type="${type}" value="${esc(val)}" ${required}>`}</div>`}function viewProject(id){let p=db.projects.find(x=>x.id===id);if(!p)return;let links=(p.dossierLinks||p.docs||'').split(/\r?\n/).filter(Boolean);let detail=(label,value)=>`<div class="field"><label>${label}</label><div>${value||'—'}</div></div>`;document.querySelector('#modal').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>${esc(p.name)}</h2><div class="form">${detail('Chủ đầu tư',esc(p.investor||'Chưa phân loại'))}${detail('Loại dự án',esc(p.projectType||'Trạm sạc'))}${detail('Mã dự án',esc(p.code||p.id))}${detail('Mã trạm',esc(p.stationCode||''))}${detail('Tiến độ hợp đồng',p.contractProgress===''?'—':esc(p.contractProgress)+'%')}${detail('Tiến độ thực tế',esc(p.progress)+'%')}${detail('Ngày nhận biên bản bàn giao mặt bằng',esc(p.handoverDate))}${detail('Ngày nghiệm thu, bàn giao vận hành',esc(p.commissioningDate))}${detail('Tạm ứng từ chủ đầu tư',money(p.advance))}${detail('Ngày tạm ứng',esc(p.advanceDate))}${detail('Thầu phụ thi công',esc(p.subcontractor))}${detail('Đã tạm ứng cho thầu phụ',money(p.subAdvance))}${detail('Ngày tạm ứng thầu phụ',esc(p.subAdvanceDate))}${detail('Đã thanh toán cho thầu phụ',money(p.subPaid))}${detail('Ngày thanh toán thầu phụ',esc(p.subPaidDate))}${detail('Người phụ trách',esc(p.owner))}${detail('Tình trạng',badge(p.status))}<div class="field full"><label>Vướng mắc / phát sinh</label><div>${esc(p.blocker||'—')}</div></div><div class="field full"><label>Hồ sơ</label><div>${p.drawingUrl?`<a class="link" href="${esc(p.drawingUrl)}" target="_blank">Bản vẽ thiết kế ↗</a><br>`:''}${p.contractUrl?`<a class="link" href="${esc(p.contractUrl)}" target="_blank">Hợp đồng ↗</a><br>`:''}${links.map((u,i)=>`<a class="link" href="${esc(u)}" target="_blank">Hồ sơ ${i+1} ↗</a>`).join('<br>')||'Chưa có liên kết hồ sơ'}</div></div></div><div class="footbuttons"><button class="btn" onclick="closeModal()">Đóng</button><button class="btn primary" id="detailEdit">Sửa thông tin</button></div></div></div>`;document.querySelector('#detailEdit').onclick=()=>editProject(id)}function editProject(id){let p=db.projects.find(x=>x.id===id)||{id:'P'+Date.now(),code:'',stationCode:'',name:'',owner:'',progress:0,contractProgress:'',status:'Chuẩn bị',contract:0,advance:0,advanceDate:'',paid:0,handoverDate:'',commissioningDate:'',subcontractor:'',subAdvance:0,subAdvanceDate:'',subPaid:0,subPaidDate:'',investor:'',projectType:'Trạm sạc',blocker:'',drawingUrl:'',contractUrl:'',dossierLinks:''};document.querySelector('#modal').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>${id?'Cập nhật dự án':'Thêm dự án'}</h2><form id="pf"><div class="form"><div class="field"><label>Chủ đầu tư</label><select name="investor"><option value="">Chưa phân loại</option>${db.settings.investors.map(x=>`<option ${p.investor===x?'selected':''}>${esc(x)}</option>`)}</select></div><div class="field"><label>Loại dự án</label><select name="projectType">${db.settings.projectTypes.map(x=>`<option ${(p.projectType||'Trạm sạc')===x?'selected':''}>${x}</option>`)}</select></div>${field('Tên dự án *','name',p.name,'text',true,'required')}${field('Mã dự án','code',p.code||p.id)}${field('Mã trạm','stationCode',p.stationCode)}${field('Tiến độ hợp đồng (%)','contractProgress',p.contractProgress,'number')}${field('Tiến độ thực tế (%)','progress',p.progress,'number')}${field('Người phụ trách','owner',p.owner)}<div class="field"><label>Tình trạng</label><select name="status">${['Chuẩn bị','Đang thi công','Nghiệm thu','Tạm dừng','Hoàn thành'].map(x=>`<option ${p.status===x?'selected':''}>${x}</option>`)}</select></div>${field('Ngày nhận biên bản bàn giao mặt bằng','handoverDate',p.handoverDate,'date')}${field('Ngày nghiệm thu, bàn giao vận hành','commissioningDate',p.commissioningDate,'date')}${field('Giá trị hợp đồng CĐT (VNĐ)','contract',p.contract,'number')}${field('Tạm ứng từ chủ đầu tư (VNĐ)','advance',p.advance,'number')}${field('Ngày tạm ứng từ chủ đầu tư','advanceDate',p.advanceDate,'date')}${field('Đã thu từ chủ đầu tư (VNĐ)','paid',p.paid,'number')}${field('Thầu phụ thi công','subcontractor',p.subcontractor)}${field('Đã tạm ứng cho thầu phụ (VNĐ)','subAdvance',p.subAdvance,'number')}${field('Ngày tạm ứng thầu phụ','subAdvanceDate',p.subAdvanceDate,'date')}${field('Đã thanh toán cho thầu phụ (VNĐ)','subPaid',p.subPaid,'number')}${field('Ngày thanh toán thầu phụ','subPaidDate',p.subPaidDate,'date')}${field('Link bản vẽ thiết kế','drawingUrl',p.drawingUrl,'url',true)}${field('Link hợp đồng','contractUrl',p.contractUrl,'url',true)}${field('Các link hồ sơ khác (mỗi link một dòng)','dossierLinks',p.dossierLinks||p.docs,'textarea',true)}${field('Vướng mắc / phát sinh','blocker',p.blocker,'textarea',true)}</div><div class="footbuttons"><span>${id?`<button type="button" class="btn" id="deleteInForm">Xóa dự án</button>`:''}</span><span><button type="button" class="btn" onclick="closeModal()">Hủy</button> <button class="btn primary">Lưu dự án</button></span></div></form></div></div>`;document.querySelector('#pf').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));for(let k of ['progress','contract','advance','paid','subAdvance','subPaid'])d[k]=Number(d[k])||0;d.contractProgress=d.contractProgress===''?'':Math.min(100,Math.max(0,Number(d.contractProgress)||0));d.progress=Math.min(100,Math.max(0,d.progress));d.updated=new Date().toISOString().slice(0,10);if(id)Object.assign(p,d);else db.projects.unshift({...p,...d,id:d.code||p.id});closeModal();save();notice('Đã lưu dự án')};document.querySelector('#deleteInForm')?.addEventListener('click',()=>deleteProject(id))}
function editReport(){if(!db.projects.length)return notice('Hãy thêm dự án trước');document.querySelector('#modal').innerHTML=`<div class="modalbg"><div class="modal"><h2>Ghi báo cáo hiện trường</h2><form id="rf"><div class="form"><div class="field"><label>Dự án</label><select name="projectId">${db.projects.map(p=>`<option value="${esc(p.id)}">${esc(p.code||p.id)} · ${esc(p.name)}</option>`)}</select></div>${field('Ngày','date',new Date().toISOString().slice(0,10),'date')}${field('Người ghi','author','','text',false,'required')}${field('Liên kết ảnh / hồ sơ','docs','','url')}${field('Nội dung *','content','','textarea',true)}</div><div class="footbuttons"><span></span><span><button type="button" class="btn" onclick="closeModal()">Hủy</button> <button class="btn primary">Lưu báo cáo</button></span></div></form></div></div>`;document.querySelector('#rf').onsubmit=e=>{e.preventDefault();db.reports.unshift({id:'R'+Date.now(),...Object.fromEntries(new FormData(e.target))});closeModal();save();notice('Đã lưu báo cáo')}}
function closeModal(){document.querySelector('#modal').innerHTML=''}function notice(t){let x=document.querySelector('#toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),2100)}function deleteProject(id){if(!confirm('Xóa dự án và báo cáo hiện trường liên quan?'))return;db.projects=db.projects.filter(p=>p.id!==id);db.reports=db.reports.filter(r=>r.projectId!==id);closeModal();save()}function deleteReport(id){if(!confirm('Xóa báo cáo này?'))return;db.reports=db.reports.filter(r=>r.id!==id);save()}
function csv(v){return '"'+String(v??'').replaceAll('"','""')+'"'}function exportCsv(){let rows=[['Loại','Chủ đầu tư','Loại dự án','Tên dự án','Mã dự án','Mã trạm','Tiến độ hợp đồng','Tiến độ thực tế','Ngày bàn giao mặt bằng','Ngày nghiệm thu vận hành','Giá trị hợp đồng','Tạm ứng CĐT','Ngày tạm ứng CĐT','Đã thu CĐT','Còn phải thu','Thầu phụ','Tạm ứng thầu phụ','Ngày tạm ứng thầu phụ','Đã thanh toán thầu phụ','Ngày thanh toán thầu phụ','Vướng mắc','Link bản vẽ','Link hợp đồng','Link hồ sơ khác','Người phụ trách','Tình trạng','Ngày cập nhật']];db.projects.forEach(p=>rows.push(['Dự án',p.investor,p.projectType,p.name,p.code||p.id,p.stationCode,p.contractProgress,p.progress,p.handoverDate,p.commissioningDate,p.contract,p.advance,p.advanceDate,p.paid,remain(p),p.subcontractor,p.subAdvance,p.subAdvanceDate,p.subPaid,p.subPaidDate,p.blocker,p.drawingUrl,p.contractUrl,p.dossierLinks||p.docs,p.owner,p.status,p.updated]));db.reports.forEach(r=>rows.push(['Báo cáo','','',name(r.projectId),r.projectId,'','','','','','','','','','','','','','','',r.content,r.docs,'','','','',r.date]));let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(csv).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download='epc-du-an-bao-cao.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}document.querySelector('#export').onclick=exportCsv;
function authMessage(message){document.querySelector('#authMessage').textContent=message||''}
async function loadSharedState(user){let snap=await stateRef.get();if(!snap.exists){let initial=normalizeCloudData(db);await stateRef.set({revision:1,payload:initial,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});cloudRevision=1;db=initial}else{let data=snap.data();cloudRevision=Number(data.revision)||0;db=normalizeCloudData(data.payload||{})}cloudReady=true;syncPaused=false;document.querySelector('#authGate').classList.add('hidden');document.querySelector('#who').textContent=user.email||'';render();if(unsubscribeState)unsubscribeState();unsubscribeState=stateRef.onSnapshot(s=>{if(!s.exists||pendingCloudWrites||document.querySelector('#modal').innerHTML)return;let data=s.data();if(Number(data.revision)>cloudRevision){db=normalizeCloudData(data.payload||{});cloudRevision=Number(data.revision);localStorage.setItem(KEY,JSON.stringify(db));render();notice('Đã đồng bộ cập nhật mới')}} ,()=>{syncPaused=true;notice('Mất kết nối với dữ liệu trực tuyến. Tải lại trang để thử lại.')})}
async function initializeCloud(){let cfg=window.EPC_FIREBASE_CONFIG;if(!window.firebase||!cfg){document.querySelector('#configHint').textContent='Ứng dụng chưa kết nối Firebase.';document.querySelector('#googleLogin').disabled=true;return}firebase.initializeApp(cfg);firebaseAuth=firebase.auth();firebaseDb=firebase.firestore();stateRef=firebaseDb.doc('epc/companyData');firebaseAuth.onAuthStateChanged(async user=>{if(!user){cloudReady=false;document.querySelector('#who').textContent='';document.querySelector('#authGate').classList.remove('hidden');return}try{await loadSharedState(user)}catch{cloudReady=false;authMessage('Chưa có quyền truy cập dữ liệu. Hãy liên hệ quản trị viên.') ;await firebaseAuth.signOut()}})}
document.querySelector('#googleLogin').onclick=async()=>{if(!firebaseAuth)return;let provider=new firebase.auth.GoogleAuthProvider();try{if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){await firebaseAuth.signInWithRedirect(provider)}else{await firebaseAuth.signInWithPopup(provider)}}catch{authMessage('Đăng nhập Google chưa thành công. Hãy thử lại.')}};
document.querySelector('#logout').onclick=async()=>{if(firebaseAuth)await firebaseAuth.signOut()};document.querySelector('#importBackup').onclick=()=>document.querySelector('#backupFile').click();document.querySelector('#backupFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let imported=JSON.parse(await file.text());if(!Array.isArray(imported.projects)||!Array.isArray(imported.reports))throw new Error('invalid');if(confirm('Thay toàn bộ dữ liệu trực tuyến bằng bản sao này? Hãy chỉ nhập trong lần thiết lập ban đầu.')){db=normalizeCloudData(imported);save();notice('Đã nhập bản sao; đang đồng bộ lên mạng')}}catch{notice('Tệp sao lưu không hợp lệ')}e.target.value=''};render();initializeCloud();</script></body></html>
