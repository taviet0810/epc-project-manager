<body>

const sample={projects:[

{id:'r2',projectId:'TNG10596',date:'2026-10-28',author:'Lê Đình Thái',content:'Theo dõi ký phụ lục hợp đồng và tiến độ cấp vật tư.'},
{id:'r3',projectId:'HN02459',date:'2026-10-28',author:'Lương Văn Anh',content:'Bổ sung biên bản nghiệm thu và hoàn tất bàn giao mặt bằng.'}]};
let db=loadData(),current='home';db.supply??=[];db.tenders??=[];db.settings??={investors:['Wincomer','V-Green'],projectTypes:['Trạm sạc','Tủ đổi pin','Khác']};db.settings.investors=[...new Set([...(db.settings.investors||[]),...db.projects.map(p=>p.investor).filter(Boolean)])];db.settings.projectTypes=[...new Set([...(db.settings.projectTypes||[]),...db.projects.map(p=>p.projectType).filter(Boolean)])];db.projects.forEach(p=>{p.subcontractor??='';p.subAdvance??=0;p.subPaid??=0;p.investor??='';p.projectType??='Trạm sạc';p.contractStartDate??='';p.contractEndDate??='';p.stationCode??='';p.handoverDate??='';p.commissioningDate??='';p.advanceDate??='';p.subAdvanceDate??='';p.subPaidDate??='';p.drawingUrl??='';p.contractUrl??='';p.dossierLinks??=p.docs||''});function loadData(){try{let v=localStorage.getItem(KEY);if(v){let d=JSON.parse(v);d.projects.forEach(p=>{p.subcontractor??='';p.subAdvance??=0;p.subPaid??=0;p.investor??='';p.projectType??='Trạm sạc';p.contractStartDate??='';p.contractEndDate??='';p.stationCode??='';p.handoverDate??='';p.commissioningDate??='';p.advanceDate??='';p.subAdvanceDate??='';p.subPaidDate??='';p.drawingUrl??='';p.contractUrl??='';p.dossierLinks??=p.docs||''});return d}let old=localStorage.getItem('epc-project-manager-v1');if(old){let migrated=JSON.parse(old);if(migrated.projects?.some(p=>p.name?.includes('Depot Long Biên')))return structuredClone(sample);migrated.projects.forEach(p=>{p.subcontractor='';p.subAdvance=0;p.subPaid=0;p.investor='';p.projectType='Trạm sạc';p.contractStartDate='';p.contractEndDate='';p.stationCode='';p.handoverDate='';p.commissioningDate='';p.advanceDate='';p.subAdvanceDate='';p.subPaidDate='';p.drawingUrl='';p.contractUrl='';p.dossierLinks=p.docs||''});return migrated}}catch{}return structuredClone(sample)}let firebaseAuth=null,firebaseDb=null,stateRef=null,accessRef=null,authorizedEmails=[],currentUserEmail="",isOwner=false,cloudRevision=0,cloudReady=false,syncPaused=false,pendingCloudWrites=0,saveQueue=Promise.resolve(),unsubscribeState=null;const OWNER_EMAIL="taviet081019@gmail.com";
function normalizeCloudData(value){value=value&&typeof value==='object'?value:{};value.projects??=[];value.reports??=[];value.supply??=[];value.tenders??=[];value.settings??={investors:['Wincomer','V-Green'],projectTypes:['Trạm sạc','Tủ đổi pin','Khác']};value.settings.investors??=['Wincomer','V-Green'];value.settings.projectTypes??=['Trạm sạc','Tủ đổi pin','Khác'];value.settings.investors=[...new Set([...value.settings.investors,...value.projects.map(p=>p.investor).filter(Boolean)])];value.settings.projectTypes=[...new Set([...value.settings.projectTypes,...value.projects.map(p=>p.projectType).filter(Boolean)])];value.projects.forEach(p=>{p.subcontractor??='';p.subAdvance??=0;p.subPaid??=0;p.investor??='';p.projectType??='Trạm sạc';p.contractStartDate??='';p.contractEndDate??='';p.stationCode??='';p.handoverDate??='';p.commissioningDate??='';p.advanceDate??='';p.subAdvanceDate??='';p.subPaidDate??='';p.drawingUrl??='';p.contractUrl??='';p.dossierLinks??=p.docs||''});return value}
function save(){localStorage.setItem(KEY,JSON.stringify(db));render();if(!cloudReady||syncPaused||!stateRef)return;pendingCloudWrites++;saveQueue=saveQueue.then(async()=>{let payload=JSON.parse(JSON.stringify(db)),expectedRevision=cloudRevision;await firebaseDb.runTransaction(async tx=>{let snap=await tx.get(stateRef),actual=snap.exists?Number(snap.data().revision||0):0;if(actual!==expectedRevision)throw new Error('EPC_REVISION_CONFLICT');tx.set(stateRef,{revision:expectedRevision+1,payload,updatedAt:firebase.firestore.FieldValue.serverTimestamp()})});cloudRevision=expectedRevision+1;pendingCloudWrites=Math.max(0,pendingCloudWrites-1)}).catch(error=>{pendingCloudWrites=0;syncPaused=true;notice(error?.message==='EPC_REVISION_CONFLICT'?'Có người vừa cập nhật dữ liệu. Hãy tải lại trang rồi nhập lại phần vừa sửa.':'Chưa đồng bộ được dữ liệu. Kiểm tra mạng rồi tải lại trang.')})}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND',maximumFractionDigits:0}).format(+n||0)}function remain(p){return Math.max(0,(+p.contract||0)-(+p.paid||0))}function dateVi(v){return v?new Intl.DateTimeFormat('vi-VN').format(new Date(v+'T00:00:00')):'—'}function badge(s){let c=s==='Tạm dừng'?'hold':s==='Nghiệm thu'?'stop':s==='Hoàn thành'?'done':'';return `<span class="badge ${c}">${esc(s)}</span>`}function name(id){return db.projects.find(p=>p.id===id)?.name||'Dự án đã xóa'}
const viewTitle={home:'Tổng quan dự án',projects:'Quản lý dự án','progress':'Tiến độ & vướng mắc',finance:'Thanh toán & tạm ứng',documents:'Hồ sơ dự án',reports:'Báo cáo hiện trường',supply:'Cung ứng vật tư',tender:'Đấu thầu',customize:'Tùy biến danh mục dự án',users:'Quản lý người dùng'};
function render(){document.querySelector('#title').textContent=viewTitle[current];let root=document.querySelector('#page');if(current==='home')root.innerHTML=home();else if(current==='projects')root.innerHTML=projectPage();else if(current==='progress')root.innerHTML=progressPage();else if(current==='finance')root.innerHTML=financePage();else if(current==='documents')root.innerHTML=documentsPage();else if(current==='supply')root.innerHTML=supplyPage();else if(current==='tender')root.innerHTML=tenderPage();else if(current==='customize')root.innerHTML=customizePage();else if(current==='users')root.innerHTML=usersPage();else root.innerHTML=reportsPage();bind()}
function usersPage(){return `<section class="panel"><div class="panelhead"><h2>Cấp quyền truy cập</h2><span class="small">Chỉ quản trị viên có thể thêm hoặc thu hồi quyền</span></div><p>Nhập đúng địa chỉ Gmail mà người đó sẽ dùng để đăng nhập. Họ mở cùng đường dẫn ứng dụng và chọn “Tiếp tục với Google”.</p><form id="grantForm" class="btnrow" style="flex-wrap:wrap"><input id="grantEmail" class="search" type="email" placeholder="ten@gmail.com" required><button class="btn primary">＋ Cấp quyền</button></form></section><section class="panel"><div class="panelhead"><h2>Người được phép sử dụng</h2></div><div id="userList">Đang tải…</div></section><section class="panel small">Tài khoản quản trị: <strong>${esc(OWNER_EMAIL)}</strong>. Người được cấp quyền có thể xem, thêm, sửa và xóa dữ liệu dự án.</section>`}
function bindUsers(){document.querySelector('#grantForm')?.addEventListener('submit',async e=>{e.preventDefault();let email=document.querySelector('#grantEmail').value.trim().toLowerCase();if(!email)return;try{await accessRef.update({emails:firebase.firestore.FieldValue.arrayUnion(email)});authorizedEmails=[...new Set([...authorizedEmails,email])].sort();render();notice('Đã cấp quyền cho '+email)}catch{notice('Không cấp được quyền. Hãy tải lại trang và thử lại.')}});document.querySelectorAll('[data-revoke-user]').forEach(b=>b.onclick=async()=>{let email=b.dataset.revokeUser;if(!confirm('Thu hồi quyền truy cập của '+email+'?'))return;try{await accessRef.update({emails:firebase.firestore.FieldValue.arrayRemove(email)});authorizedEmails=authorizedEmails.filter(x=>x!==email);render();notice('Đã thu hồi quyền')}catch{notice('Không thu hồi được quyền. Hãy thử lại.')}});let list=document.querySelector('#userList');if(list)list.innerHTML=authorizedEmails.map(email=>`<div class="docrow btnrow" style="justify-content:space-between;flex-wrap:wrap"><span>${esc(email)} ${email===OWNER_EMAIL?'<span class="badge">Quản trị viên</span>':''}</span>${email===OWNER_EMAIL?'':'<button class="btn" data-revoke-user="'+esc(email)+'">Thu hồi quyền</button>'}</div>`).join('')||'<div class="small">Chưa có người dùng nào.</div>'}function investorOverview(){let groups=[...new Set(db.projects.map(p=>p.investor||'Chưa phân loại'))].sort((a,b)=>a.localeCompare(b,'vi'));return `<section class="panel"><div class="panelhead"><h2>Tổng quan theo chủ đầu tư</h2><span class="small">Số dự án · tiến độ thực tế · giá trị hợp đồng</span></div><div class="cards">${groups.map(g=>{let ps=db.projects.filter(p=>(p.investor||'Chưa phân loại')===g),total=ps.reduce((a,p)=>a+(+p.contract||0),0),avg=ps.length?Math.round(ps.reduce((a,p)=>a+(+p.progress||0),0)/ps.length):0,types=[...new Set(ps.map(p=>p.projectType||'Trạm sạc'))].join(', ');return `<button class="card" data-select-investor="${esc(g)}" style="text-align:left"><label>${esc(g)}</label><div class="value">${ps.length} dự án</div><div class="small">${types} · Tiến độ TB ${avg}%</div><div class="small">Hợp đồng ${shortMoney(total)}</div></button>`}).join('')}</div></section>`}
function home(){let n=db.projects.length,avg=n?Math.round(db.projects.reduce((a,p)=>a+(+p.progress||0),0)/n):0,contracts=db.projects.reduce((a,p)=>a+(+p.contract||0),0),rec=db.projects.reduce((a,p)=>a+remain(p),0),pct=contracts?Math.round(db.projects.reduce((a,p)=>a+(+p.paid||0),0)/contracts*100):0;let watch=db.projects.filter(p=>p.blocker||p.status==='Tạm dừng').slice(0,6);let recent=[...db.projects].sort((a,b)=>b.updated.localeCompare(a.updated));return `<div class="cards"><div class="card"><label>Tổng số dự án</label><div class="value">${n}</div><div class="small">${db.projects.filter(p=>p.status==='Đang thi công').length} dự án đang theo dõi</div></div><div class="card"><label>Tiến độ bình quân</label><div class="value">${avg}%</div><div class="bar"><span style="width:${avg}%"></span></div></div><div class="card"><label>Giá trị hợp đồng</label><div class="value">${shortMoney(contracts)}</div><div class="small">VND · Dữ liệu mẫu</div></div><div class="card"><label>Còn phải thu</label><div class="value">${shortMoney(rec)}</div><div class="small">Hợp đồng trừ đã thanh toán (${pct}% đã thu)</div></div></div>${investorOverview()}<div class="dashgrid"><section class="panel"><div class="panelhead"><h2>Dự án cần chú ý</h2></div>${watch.map(p=>`<div class="alert"><b>${esc(p.code||p.id)}</b><span style="float:right">${badge(p.status)}</span><p>${esc(p.blocker||'Cần theo dõi tiến độ nghiệm thu.')}</p><div class="small">Phụ trách: ${esc(p.owner)}</div><button class="btn" data-edit="${esc(p.id)}">Xem dự án</button></div>`).join('')||'<div class="small">Không có vướng mắc cần chú ý.</div>'}</section><section class="panel"><div class="panelhead"><h2>Tiến độ theo dự án</h2></div>${[...db.projects].sort((a,b)=>b.progress-a.progress).map(p=>`<div class="alert"><span>${esc(p.code||p.id)}</span><b style="float:right">${p.progress}%</b><div class="bar"><span style="width:${p.progress}%"></span></div></div>`).join('')}</section></div><section class="panel"><div class="panelhead"><h2>Dự án cập nhật gần đây</h2><button class="btn" data-nav="projects">Danh sách dự án</button></div><div class="scroll"><table><thead><tr><th>Mã dự án</th><th>Tên dự án</th><th>Phụ trách</th><th>Tiến độ</th><th>Tình trạng</th><th>Còn phải thu</th></tr></thead><tbody>${recent.map(p=>`<tr><td>${esc(p.code||p.id)}</td><td>${esc(p.name)}</td><td>${esc(p.owner)}</td><td>${p.progress}%</td><td>${badge(p.status)}</td><td>${money(remain(p))}</td></tr>`).join('')}</tbody></table></div></section>`}
function shortMoney(n){if(n>=1e9)return (n/1e9).toLocaleString('vi-VN',{maximumFractionDigits:2})+' tỷ';if(n>=1e6)return (n/1e6).toLocaleString('vi-VN',{maximumFractionDigits:1})+' tr';return money(n)}
function projectPage(){let investors=[...new Set([...db.settings.investors,...(db.projects.some(p=>!p.investor)?['Chưa phân loại']:[])])].sort((a,b)=>a.localeCompare(b,'vi'));return `<section class="panel"><div class="panelhead"><h2>Danh sách dự án</h2><div class="btnrow"><input id="search" class="search" placeholder="Tìm tên, mã, phụ trách"><select id="investorFilter" class="search"><option value="">Tất cả chủ đầu tư</option>${investors.map(x=>`<option>${esc(x)}</option>`)}</select><select id="typeFilter" class="search"><option value="">Tất cả loại dự án</option>${db.settings.projectTypes.map(x=>`<option>${x}</option>`)}</select><select id="status" class="search"><option value="">Tất cả tình trạng</option>${['Chuẩn bị','Đang thi công','Nghiệm thu','Tạm dừng','Hoàn thành'].map(x=>`<option>${x}</option>`)}</select></div></div><div class="scroll"><table><thead><tr><th>Chủ đầu tư</th><th>Loại dự án</th><th>Tên dự án</th><th>Mã dự án</th><th>Thời gian theo hợp đồng</th><th>Tiến độ thực tế</th><th>Vướng mắc</th><th>Thầu phụ</th></tr></thead><tbody id="projectsRows">${projectRows(db.projects)}</tbody></table></div><div class="small" style="margin-top:8px">Chọn một dòng để xem đầy đủ thông tin dự án.</div></section>`}function projectRows(list){return list.map(p=>`<tr class="clickrow" data-view="${esc(p.id)}"><td>${esc(p.investor||'Chưa phân loại')}</td><td>${esc(p.projectType||'Trạm sạc')}</td><td><b>${esc(p.name)}</b></td><td>${esc(p.code||p.id)}</td><td>${p.contractStartDate||p.contractEndDate?`${dateVi(p.contractStartDate)} đến ${dateVi(p.contractEndDate)}`:'—'}</td><td>${p.progress}%<div class="bar"><span style="width:${p.progress}%"></span></div></td><td>${esc(p.blocker||'—')}</td><td>${esc(p.subcontractor||'—')}</td></tr>`).join('')||'<tr><td colspan="8">Chưa có dự án</td></tr>'}
function progressPage(){return `<section class="panel"><div class="panelhead"><h2>Cập nhật tiến độ và xử lý vướng mắc</h2><button class="btn primary" id="progressAdd">Cập nhật dự án</button></div><div class="scroll"><table><thead><tr><th>Mã / Dự án</th><th>Tiến độ</th><th>Tình trạng</th><th>Vướng mắc / phát sinh</th><th>Phụ trách</th><th>Cập nhật</th></tr></thead><tbody>${db.projects.map(p=>`<tr><td><b>${esc(p.code||p.id)}</b><br>${esc(p.name)}</td><td>${p.progress}%<div class="bar"><span style="width:${p.progress}%"></span></div></td><td>${badge(p.status)}</td><td>${esc(p.blocker||'—')}</td><td>${esc(p.owner)}</td><td><button class="btn" data-edit="${esc(p.id)}">Cập nhật</button></td></tr>`).join('')}</tbody></table></div></section>`}
function financePage(){let sum=k=>db.projects.reduce((a,p)=>a+(+p[k]||0),0);return `<div class="summary"><div class="card"><label>Tổng hợp đồng</label><div class="value">${shortMoney(sum('contract'))}</div></div><div class="card"><label>Đã thu từ chủ đầu tư</label><div class="value">${shortMoney(sum('paid'))}</div></div><div class="card"><label>Đã thanh toán cho thầu phụ</label><div class="value">${shortMoney(sum('subPaid'))}</div></div></div><section class="panel"><div class="panelhead"><h2>Theo dõi tài chính chủ đầu tư và thầu phụ</h2></div><div class="scroll"><table><thead><tr><th>Chủ đầu tư</th><th>Loại</th><th>Mã dự án</th><th>Tên dự án</th><th>Hợp đồng CĐT</th><th>Tạm ứng CĐT</th><th>Đã thu CĐT</th><th>Còn phải thu CĐT</th><th>Nhà thầu phụ</th><th>Tạm ứng thầu phụ</th><th>Đã trả thầu phụ</th><th></th></tr></thead><tbody>${db.projects.map(p=>`<tr><td>${esc(p.investor||'Chưa phân loại')}</td><td>${esc(p.projectType||'Trạm sạc')}</td><td>${esc(p.code||p.id)}</td><td>${esc(p.name)}</td><td>${money(p.contract)}</td><td>${money(p.advance)}</td><td>${money(p.paid)}</td><td><b>${money(remain(p))}</b></td><td>${esc(p.subcontractor||'—')}</td><td>${money(p.subAdvance)}</td><td>${money(p.subPaid)}</td><td><button class="btn" data-edit="${esc(p.id)}">Cập nhật</button></td></tr>`).join('')}</tbody></table></div></section>`}
function documentsPage(){return `<section class="panel"><div class="panelhead"><h2>Hồ sơ dự án</h2><span class="small">Liên kết được cập nhật trong hồ sơ chi tiết của từng dự án</span></div><div class="scroll"><table><thead><tr><th>Chủ đầu tư</th><th>Loại</th><th>Dự án / mã</th><th>Bản vẽ thiết kế</th><th>Hợp đồng</th><th>Hồ sơ khác</th><th></th></tr></thead><tbody>${db.projects.map(p=>`<tr><td>${esc(p.investor||'Chưa phân loại')}</td><td>${esc(p.projectType||'Trạm sạc')}</td><td><b>${esc(p.name)}</b><br><span class="small">${esc(p.code||p.id)} · Mã trạm ${esc(p.stationCode||'—')}</span></td><td>${p.drawingUrl?`<a class="link" href="${esc(p.drawingUrl)}" target="_blank" rel="noopener">Mở bản vẽ ↗</a>`:'—'}</td><td><span class="small">Số HĐ: ${esc(p.contractNo||'—')}</span><br>${p.contractUrl?`<a class="link" href="${esc(p.contractUrl)}" target="_blank" rel="noopener">Mở hợp đồng ↗</a>`:'—'}</td><td>${(p.dossierLinks||p.docs||'').split(/\r?\n/).filter(Boolean).map((u,i)=>`<a class="link" href="${esc(u)}" target="_blank" rel="noopener">Hồ sơ ${i+1} ↗</a>`).join('<br>')||'—'}</td><td><button class="btn" data-edit="${esc(p.id)}">Cập nhật</button></td></tr>`).join('')||'<tr><td colspan="7">Chưa có dự án.</td></tr>'}</tbody></table></div><p class="small">Ứng dụng lưu liên kết đến tài liệu; tệp không được tải lên máy chủ. Với hồ sơ khác, nhập một liên kết trên mỗi dòng.</p></section>`}
function projectOptions(selected=''){return db.projects.map(p=>`<option value="${esc(p.id)}" ${p.id===selected?'selected':''}>${esc(p.code||p.id)} · ${esc(p.name)}</option>`).join('')}function stationCode(id){let p=db.projects.find(x=>x.id===id);return p?.stationCode||p?.code||p?.id||'Chưa gắn mã trạm'}function supplyProjectOptions(selected=''){return db.projects.map(p=>`<option value="${esc(p.id)}" ${p.id===selected?'selected':''}>${esc(stationCode(p.id))} · ${esc(p.name)}</option>`).join('')}
function supplyPage(){let projects=[...new Set(db.supply.map(x=>x.projectId).filter(Boolean))];let statuses=['Lập kế hoạch','Đã gửi yêu cầu','Đang đặt hàng','Đã giao một phần','Đã giao đủ','Tạm dừng'];return `<section class="panel"><div class="panelhead"><div><h2>Theo dõi vật tư và cung ứng theo mã trạm</h2><span class="small">Mỗi yêu cầu được gắn với mã trạm trong hồ sơ dự án</span></div><button class="btn primary" data-record-new="supply">＋ Thêm yêu cầu cung ứng</button></div><div class="btnrow" style="flex-wrap:wrap;margin-bottom:10px"><input id="supplySearch" class="search" placeholder="Tìm mã trạm, vật tư, mã yêu cầu, nhà cung cấp"><select id="supplyProject" class="search"><option value="">Tất cả mã trạm</option>${projects.map(id=>`<option value="${esc(id)}">${esc(stationCode(id))} · ${esc(name(id))}</option>`).join('')}</select><select id="supplyStatus" class="search"><option value="">Tất cả trạng thái</option>${statuses.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="scroll"><table><thead><tr><th>Mã trạm / dự án</th><th>Vật tư / thiết bị</th><th>Nhà cung cấp</th><th>Số lượng</th><th>Giá trị</th><th>Ngày cần giao</th><th>Trạng thái</th><th></th></tr></thead><tbody id="supplyRows">${supplyRows(db.supply)}</tbody></table></div></section>`}
function supplyRows(items){return items.map(x=>`<tr class="clickrow" data-record-view="supply:${esc(x.id)}"><td><b>${esc(stationCode(x.projectId))}</b><br><span class="small">${esc(name(x.projectId))}${x.code?' · '+esc(x.code):''}</span></td><td><b>${esc(x.item||'')}</b><br><span class="small">${esc(x.spec||'')}</span></td><td>${x.vendorUrl?`<a class="link" href="${esc(x.vendorUrl)}" target="_blank" rel="noopener">${esc(x.supplier||'Nhà cung cấp')} ↗</a>`:esc(x.supplier||'—')}</td><td>${esc(x.quantity||0)} ${esc(x.unit||'')}</td><td>${money(x.amount)}</td><td>${dateVi(x.requiredDate)}</td><td>${badge(x.status||'Lập kế hoạch')}</td><td><button class="btn" data-record-edit="supply:${esc(x.id)}">Sửa</button> <button class="btn" data-record-delete="supply:${esc(x.id)}">Xóa</button></td></tr>`).join('')||'<tr><td colspan="8">Không có yêu cầu cung ứng phù hợp.</td></tr>'}
function tenderPage(){let projects=[...new Set(db.tenders.map(x=>x.projectId).filter(Boolean))],statuses=['Chuẩn bị HSMT','Đang mời thầu','Đã đóng thầu','Đang đánh giá','Đã chọn nhà thầu','Không trúng','Hủy'];return `<section class="panel"><div class="panelhead"><div><h2>Theo dõi gói thầu</h2><span class="small">Hồ sơ mời thầu, hạn nộp, nhà thầu, kết quả và giá trúng thầu</span></div><button class="btn primary" data-record-new="tender">＋ Thêm gói thầu</button></div><div class="btnrow" style="flex-wrap:wrap;margin-bottom:10px"><input id="tenderSearch" class="search" placeholder="Tìm gói thầu, mã, chủ đầu tư, nhà thầu"><select id="tenderProject" class="search"><option value="">Tất cả dự án</option>${projects.map(id=>`<option value="${esc(id)}">${esc(name(id))}</option>`).join('')}</select><select id="tenderStatus" class="search"><option value="">Tất cả trạng thái</option>${statuses.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="scroll"><table><thead><tr><th>Dự án / mã gói</th><th>Tên gói / chủ đầu tư</th><th>Giá dự toán</th><th>Hạn nộp</th><th>Nhà thầu</th><th>Giá trúng thầu</th><th>Trạng thái</th><th></th></tr></thead><tbody id="tenderRows">${tenderRows(db.tenders)}</tbody></table></div></section>`}

function editRecord(kind,id=''){let rows=kind==='supply'?db.supply:db.tenders,old=rows.find(x=>x.id===id)||{},isSupply=kind==='supply',title=isSupply?'yêu cầu cung ứng':'gói thầu';if(isSupply&&!db.projects.length)return notice('Hãy tạo hồ sơ dự án và khai báo mã trạm trước khi lập yêu cầu cung ứng');let project=isSupply?`<div class="field"><label>Mã trạm *</label><select name="projectId" required><option value="">Chọn mã trạm</option>${supplyProjectOptions(old.projectId||'')}</select></div>`:`<div class="field"><label>Dự án (nếu có)</label><select name="projectId"><option value="">Không gắn dự án</option>${projectOptions(old.projectId||'')}</select></div>`;let body=isSupply?`${field('Mã yêu cầu / đơn mua','code',old.code)}${field('Tên vật tư / thiết bị *','item',old.item,'text',false,'required')}${field('Quy cách / ghi chú kỹ thuật','spec',old.spec)}${field('Nhà cung cấp','supplier',old.supplier)}${field('Link nhà cung cấp','vendorUrl',old.vendorUrl,'url')}${field('Số lượng','quantity',old.quantity||0,'number')}${field('Đơn vị','unit',old.unit)}${field('Giá trị dự kiến (VNĐ)','amount',old.amount||0,'number')}${field('Ngày yêu cầu','requestDate',old.requestDate,'date')}${field('Ngày cần giao','requiredDate',old.requiredDate,'date')}${field('Ngày giao thực tế','receivedDate',old.receivedDate,'date')}<div class="field"><label>Trạng thái</label><select name="status">${['Lập kế hoạch','Đã gửi yêu cầu','Đang đặt hàng','Đã giao một phần','Đã giao đủ','Tạm dừng'].map(v=>`<option ${old.status===v?'selected':''}>${v}</option>`)}</select></div>${field('Link báo giá / đơn hàng / hồ sơ','link',old.link,'url',true)}${field('Ghi chú','note',old.note,'textarea',true)}`:`${field('Mã gói thầu','code',old.code)}${field('Tên gói thầu *','packageName',old.packageName,'text',false,'required')}${field('Chủ đầu tư','investor',old.investor)}${field('Loại gói thầu','packageType',old.packageType)}${field('Giá dự toán (VNĐ)','estimate',old.estimate||0,'number')}${field('Ngày phát hành hồ sơ','
